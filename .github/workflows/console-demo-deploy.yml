name: Console Demo Deploy (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/console/**'
      - '.github/workflows/console-demo-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: console-demo-pages
  cancel-in-progress: false

jobs:
  build:
    name: build hosted demo bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/console
    steps:
      - name: Checkout
        # Pinned + persist-credentials:false per the workflow-hardening
        # sweep that pairs with PR #493 (verify job) and PR #492
        # (e2e-stubbed job).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build demo bundle
        env:
          # VITE_LAG_TRANSPORT=demo selects the StaticBundleTransport
          # (see src/services/transport/index.ts). main.tsx installs
          # the Helix bundle on window before React mounts.
          VITE_LAG_TRANSPORT: demo
          # VITE_LAG_BASE lets vite emit asset URLs prefixed with the
          # repo name so paths resolve under
          # github.io/<user>/<repo>/...
          VITE_LAG_BASE: /layered-autonomous-governance/
        run: npm run build

      # GitHub Pages serves a SPA from a flat directory. For
      # hash-based routing (which the Console uses, see
      # src/state/router.store.ts) this is enough: every path
      # resolves to index.html and the router picks up the hash
      # client-side. No 404.html redirect needed.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/console/dist

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
